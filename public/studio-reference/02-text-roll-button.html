<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text-roll button — Studio reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wght@500;700&family=Public+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./contract.css">
<style>
  body {
    margin: 0;
    font-family: "Public Sans", system-ui, sans-serif;
    background: #0E1218;
    color: #DFE3EA;
  }
  .doc { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
  .doc h1 {
    font-family: "Anybody", system-ui, sans-serif;
    font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px;
  }
  .doc .src {
    font-family: "DM Mono", monospace; font-size: 12px;
    color: #8A93A3; margin: 0 0 20px; letter-spacing: .03em;
  }
  .doc pre.note {
    font-family: "DM Mono", monospace; font-size: 12.5px; line-height: 1.6;
    background: #161C25; border-left: 2px solid #7D97FF;
    padding: 16px 18px; margin: 0 0 24px; white-space: pre-wrap; color: #B7C0CE;
  }
  .palbar { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; flex-wrap: wrap; }
  .palbar span {
    font-family: "DM Mono", monospace; font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: #8A93A3;
  }
  .palbar button {
    font-family: "DM Mono", monospace; font-size: 11.5px;
    padding: 5px 11px; border: 1px solid #2B3441; background: transparent;
    color: #8A93A3; cursor: pointer; border-radius: 2px;
  }
  .palbar button[aria-pressed="true"] { border-color: #DFE3EA; color: #DFE3EA; }

  /* when embedded in a catalogue card, the parent supplies the chrome:
     hide the doc header and the local palette bar, keep only the stage */
  body.embedded { background: transparent; }
  body.embedded .doc { padding: 0; max-width: none; }
  body.embedded .doc > h1,
  body.embedded .doc > .src,
  body.embedded .doc > pre.note,
  body.embedded .palbar { display: none; }
  body.embedded .studio { border: none; }

  /* the sandbox the component ships into */
  .studio {
    padding: 48px 28px;
    border: 1px solid #2B3441;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; min-height: 240px;
  }
  .studio .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .studio .cap {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-dim); margin: 0;
  }
  .studio h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; margin: 0 0 6px; }
  .studio .replay {
    border: 1px solid var(--line); background: transparent; color: var(--text-dim);
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  .studio .replay:hover { color: var(--text); border-color: var(--text-dim); }
</style>
<style>
/* =====================================================================
   Text-roll button
   house pattern
   ↓ THIS is the part that becomes components/studio/. Everything above
     is harness. Nothing below reads anything but contract tokens.
   ===================================================================== */


.roll {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  padding: 0 26px;
  height: 46px;
  border-radius: var(--radius);
  cursor: pointer;
  overflow: hidden;
  transition: border-color var(--dur) var(--ease);
}
.roll:hover,
.roll:focus-visible { border-color: var(--brand); }
.roll__box { display: block; height: 46px; overflow: hidden; }
.roll__in {
  display: flex;
  flex-direction: column;
  transition: transform var(--dur) var(--ease);
}
.roll__in span { height: 46px; display: grid; place-items: center; }
.roll__in span + span { color: var(--brand); }
.roll:hover .roll__in,
.roll:focus-visible .roll__in { transform: translateY(-46px); }
</style>
</head>
<body>
<div class="doc">
  <h1>Text-roll button</h1>
  <p class="src">house pattern</p>
  <pre class="note">Two identical labels stacked in an overflow-hidden box. The stack slides up
by exactly one label height. The arriving twin is in the accent, so the roll
reads as a colour change as well as a movement.</pre>

  <div class="palbar">
    <span>Palette</span>
    <button data-pal="ember"   aria-pressed="true">ember</button>
    <button data-pal="venue"   aria-pressed="false">venue</button>
    <button data-pal="gallery" aria-pressed="false">gallery</button>
    <button data-pal="clinic"  aria-pressed="false">clinic</button>
  </div>

  <div class="studio" id="studio" data-pal="ember">

    <button class="roll">
      <span class="roll__box">
        <span class="roll__in"><span>View the menu</span><span>View the menu</span></span>
      </span>
    </button>
  </div>
</div>

<script>
/* harness — palette switcher. Not part of the component.
   Also accepts the palette from a parent frame, so /systems/studio can embed
   this file and drive every card from one page-level control:
     iframe.contentWindow.postMessage({ studioPalette: "venue" }, location.origin)
   And reports its content height back so the parent can size the frame to fit. */
(function () {
  var host = document.getElementById("studio");
  var btns = document.querySelectorAll(".palbar button");

  function apply(pal) {
    if (!pal) return;
    host.setAttribute("data-pal", pal);
    btns.forEach(function (o) {
      o.setAttribute("aria-pressed", String(o.getAttribute("data-pal") === pal));
    });
  }

  btns.forEach(function (b) {
    b.addEventListener("click", function () { apply(b.getAttribute("data-pal")); });
  });

  addEventListener("message", function (e) {
    if (e.origin !== location.origin && e.origin !== "null") return;
    var d = e.data;
    if (d && typeof d === "object") {
      if (d.studioPalette) apply(d.studioPalette);
      if (d.studioChrome === "off") document.body.classList.add("embedded");
      /* the catalogue's motion-pause toggle */
      if (d.studioMotion) document.documentElement.setAttribute("data-motion", d.studioMotion);
    }
  });

  function report() {
    if (parent === window) return;
    parent.postMessage({ studioHeight: document.body.scrollHeight, studioId: location.pathname }, "*");
  }
  addEventListener("load", report);
  addEventListener("resize", report);
  setTimeout(report, 300);
})();
</script>

</body>
</html>
